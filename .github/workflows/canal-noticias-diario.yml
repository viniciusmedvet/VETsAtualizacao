name: Canal de notícias — produção diária

on:
  schedule:
    - cron: "40 8 * * *" # 05:40 em Brasília (UTC-3): pauta e roteiros prontos antes do slot das 07:00
  workflow_dispatch:
    inputs:
      data_publicacao:
        description: "Data de publicação (AAAA-MM-DD). Vazio = hoje em Brasília"
        required: false

permissions:
  contents: write

concurrency:
  group: canal-noticias-diario
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: canal-noticias
    env:
      DATA_PUBLICACAO: ${{ inputs.data_publicacao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canal-noticias/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Coletar referências dos canais
        run: node scripts/coletar-fontes.mjs
        continue-on-error: true # sem coleta, o gerador pesquisa as notícias sozinho
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Gerar roteiros e textos verificados
        run: node scripts/gerar-conteudo.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Versionar a produção do dia
        run: |
          git config user.name "canal-noticias-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saida
          git commit -m "Canal de notícias: produção de $(TZ=America/Sao_Paulo date +%F)" || echo "Nada novo para versionar"
          git push
